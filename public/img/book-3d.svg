<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f1fb"/>
      <stop offset="0.55" stop-color="#f6f2ec"/>
      <stop offset="1" stop-color="#efe9f4"/>
    </linearGradient>

    <radialGradient id="blobV" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6d5ef0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6d5ef0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff8a5c" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobT" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#12a594" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#12a594" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="vFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b6bf5"/><stop offset="1" stop-color="#4b3fb0"/>
    </linearGradient>
    <linearGradient id="cFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa878"/><stop offset="1" stop-color="#ef6a3c"/>
    </linearGradient>
    <linearGradient id="tFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48d6c5"/><stop offset="1" stop-color="#12a594"/>
    </linearGradient>
    <linearGradient id="gFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd684"/><stop offset="1" stop-color="#e6ac37"/>
    </linearGradient>

    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#2b2350" flood-opacity="0.20"/>
    </filter>
    <filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>

  <rect width="1280" height="900" fill="url(#wash)"/>

  <!-- ambient colour -->
  <circle cx="240" cy="180" r="360" fill="url(#blobV)" filter="url(#blur40)"/>
  <circle cx="1120" cy="250" r="340" fill="url(#blobC)" filter="url(#blur40)"/>
  <circle cx="900" cy="820" r="380" fill="url(#blobT)" filter="url(#blur40)"/>

  <!-- ===== isometric book stack (bottom-right) ===== -->
  <!-- dx = 34, dy = -20 -->
  <g filter="url(#drop)">
    <!-- book 1 (bottom, gold) -->
    <g transform="translate(690 560)">
      <polygon points="0,0 360,0 394,-20 34,-20" fill="#ffe4a6"/>
      <polygon points="360,0 394,-20 394,58 360,78" fill="#c98f26"/>
      <rect x="0" y="0" width="360" height="78" rx="4" fill="url(#gFront)"/>
      <rect x="26" y="22" width="150" height="10" rx="5" fill="#fff" opacity="0.55"/>
      <rect x="26" y="42" width="96" height="8" rx="4" fill="#fff" opacity="0.35"/>
    </g>

    <!-- book 2 (teal) -->
    <g transform="translate(662 486)">
      <polygon points="0,0 340,0 374,-20 34,-20" fill="#9fe9df"/>
      <polygon points="340,0 374,-20 374,54 340,74" fill="#0d8577"/>
      <rect x="0" y="0" width="340" height="74" rx="4" fill="url(#tFront)"/>
      <rect x="24" y="20" width="132" height="10" rx="5" fill="#fff" opacity="0.55"/>
      <rect x="24" y="40" width="80" height="8" rx="4" fill="#fff" opacity="0.35"/>
    </g>

    <!-- book 3 (coral) -->
    <g transform="translate(700 416)">
      <polygon points="0,0 300,0 334,-20 34,-20" fill="#ffcbac"/>
      <polygon points="300,0 334,-20 334,50 300,70" fill="#cf5327"/>
      <rect x="0" y="0" width="300" height="70" rx="4" fill="url(#cFront)"/>
      <rect x="22" y="18" width="120" height="10" rx="5" fill="#fff" opacity="0.55"/>
      <rect x="22" y="38" width="70" height="8" rx="4" fill="#fff" opacity="0.35"/>
    </g>

    <!-- book 4 (violet, top of stack) -->
    <g transform="translate(742 350)">
      <polygon points="0,0 250,0 284,-20 34,-20" fill="#c9c0fb"/>
      <polygon points="250,0 284,-20 284,46 250,66" fill="#3a2f92"/>
      <rect x="0" y="0" width="250" height="66" rx="4" fill="url(#vFront)"/>
      <rect x="20" y="16" width="108" height="10" rx="5" fill="#fff" opacity="0.6"/>
      <rect x="20" y="36" width="64" height="8" rx="4" fill="#fff" opacity="0.4"/>
    </g>
  </g>

  <!-- floating closed book, mid-right -->
  <g filter="url(#drop)" transform="translate(1030 470) rotate(-10)">
    <polygon points="0,0 210,0 240,-18 30,-18" fill="#9fe9df"/>
    <polygon points="210,0 240,-18 240,58 210,76" fill="#0d8577"/>
    <rect x="0" y="0" width="210" height="76" rx="5" fill="url(#tFront)"/>
    <rect x="20" y="22" width="104" height="10" rx="5" fill="#fff" opacity="0.6"/>
    <rect x="20" y="44" width="64" height="8" rx="4" fill="#fff" opacity="0.4"/>
  </g>

  <!-- small open book, top-right -->
  <g filter="url(#drop)" transform="translate(980 120) rotate(8)">
    <path d="M0 12 Q70 -8 150 12 L150 96 Q70 78 0 96 Z" fill="#efeafe"/>
    <path d="M150 12 Q230 -8 300 12 L300 96 Q230 78 150 96 Z" fill="#ffffff"/>
    <path d="M150 12 L150 96" stroke="#c9bff6" stroke-width="4"/>
    <g stroke="#cabff6" stroke-width="4" stroke-linecap="round" opacity="0.7">
      <path d="M24 34 H120"/><path d="M24 52 H120"/><path d="M24 70 H108"/>
      <path d="M180 34 H276"/><path d="M180 52 H276"/><path d="M180 70 H262"/>
    </g>
  </g>
</svg>
