<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f4"/>
      <stop offset="0.5" stop-color="#f6f1e6"/>
      <stop offset="1" stop-color="#efe6d3"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#fdf6e7" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fdf6e7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0.15">
      <stop offset="0" stop-color="#efe6d1"/>
      <stop offset="0.75" stop-color="#fdfaf1"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="0.15">
      <stop offset="0" stop-color="#efe6d1"/>
      <stop offset="0.75" stop-color="#fdfaf1"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f5d7c"/>
      <stop offset="1" stop-color="#20455e"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1200" height="620" fill="url(#sky)"/>
  <rect width="1200" height="620" fill="url(#glow)"/>

  <!-- soft cast shadow under the book -->
  <ellipse cx="600" cy="486" rx="430" ry="46" fill="#6a5a3d" opacity="0.20" filter="url(#soft)"/>

  <!-- back cover -->
  <path d="M600 150 L188 196 Q168 470 214 486 L600 452 Z" fill="url(#spine)" opacity="0.9"/>
  <path d="M600 150 L1012 196 Q1032 470 986 486 L600 452 Z" fill="url(#spine)" opacity="0.9"/>

  <!-- page stacks (fanned edges) -->
  <g stroke="#d9cdb0" stroke-width="2" fill="none" opacity="0.8">
    <path d="M600 442 L214 476 Q200 468 202 452"/>
    <path d="M600 436 L220 466 Q208 458 210 444"/>
    <path d="M600 430 L226 456 Q216 448 218 436"/>
    <path d="M600 442 L986 476 Q1000 468 998 452"/>
    <path d="M600 436 L980 466 Q992 458 990 444"/>
    <path d="M600 430 L974 456 Q984 448 982 436"/>
  </g>

  <!-- left open page -->
  <path d="M600 158 Q404 150 214 210 Q214 400 226 440 Q410 388 600 430 Z" fill="url(#pageL)" stroke="#e4d9bd" stroke-width="1.5"/>
  <!-- right open page -->
  <path d="M600 158 Q796 150 986 210 Q986 400 974 440 Q790 388 600 430 Z" fill="url(#pageR)" stroke="#e4d9bd" stroke-width="1.5"/>

  <!-- center gutter shadow -->
  <path d="M600 158 L600 430" stroke="#c8b995" stroke-width="10" opacity="0.55"/>
  <path d="M600 158 L600 430" stroke="#8a7a52" stroke-width="2" opacity="0.5"/>

  <!-- text lines on pages -->
  <g stroke="#c1b189" stroke-width="4" stroke-linecap="round" opacity="0.6" fill="none">
    <path d="M300 236 Q440 214 560 232"/>
    <path d="M286 266 Q440 244 566 262"/>
    <path d="M280 296 Q440 276 566 292"/>
    <path d="M282 326 Q440 308 560 322"/>
    <path d="M292 356 Q440 340 552 352"/>

    <path d="M640 232 Q760 214 900 236"/>
    <path d="M634 262 Q760 244 914 266"/>
    <path d="M634 292 Q760 276 920 296"/>
    <path d="M640 322 Q760 308 918 326"/>
    <path d="M648 352 Q760 340 908 356"/>
  </g>

  <!-- lifting pages on the right -->
  <path d="M600 158 Q760 120 928 176 Q900 210 812 236 Q706 210 616 214 Q606 186 600 158 Z" fill="#fffdf7" stroke="#e7dcc0" stroke-width="1.5" opacity="0.95"/>
  <path d="M600 158 Q740 130 872 178 Q838 206 760 224 Q680 206 612 206 Q606 182 600 158 Z" fill="#fffefb" stroke="#ece2c8" stroke-width="1.2" opacity="0.85"/>

  <!-- drifting letters / knowledge motes -->
  <g fill="#2f5d7c" opacity="0.5" font-family="Georgia, serif" font-style="italic">
    <text x="250" y="150" font-size="26">A</text>
    <text x="944" y="176" font-size="22">z</text>
    <text x="880" y="92" font-size="18">e</text>
    <text x="330" y="110" font-size="16">i</text>
  </g>
  <g fill="#c99a3c" opacity="0.7">
    <circle cx="210" cy="128" r="3"/>
    <circle cx="990" cy="120" r="3.5"/>
    <circle cx="150" cy="300" r="2.5"/>
    <circle cx="1052" cy="286" r="2.5"/>
    <circle cx="920" cy="60" r="2"/>
  </g>
</svg>
